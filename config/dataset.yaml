# ─────────────────────────────────────────────────────────────
# تنظیمات ساخت دیتاست صوتی لهجه‌دار فارسی
# هر کلید یک یا دو خط توضیح دارد تا مشخص باشد چه کاری می‌کند.
# ─────────────────────────────────────────────────────────────

# نام شهر/لهجه‌ای که دیتاست برایش ساخته می‌شود (فقط برای برچسب‌گذاری و گزارش‌ها).
city: isfahan

# زبان Whisper هنگام برچسب‌گذاری و آموزش. برای فارسی همیشه "persian" بماند.
language: persian

# پوشه‌ای که همه‌ی داده‌ها (فایل خام، کلیپ‌ها، مانیفست، خروجی) در آن ذخیره می‌شود.
# با متغیر محیطی PASR_DATA_DIR هم می‌شود آن را عوض کرد.
data_dir: data

# اهداف حجم دیتاست؛ پنل پیشرفت را نسبت به این اعداد نشان می‌دهد.
target:
  # حداقل تعداد کلیپ تأییدشده برای یک فاین‌تیون نمایشی سر کلاس (~۴۵ دقیقه صدا).
  min_clips: 300
  # تعداد کلیپ مطلوب؛ با این مقدار بهبود WER پایدارتر و قابل‌اعتمادتر است.
  goal_clips: 800
  # مدت کل مطلوب (ساعت). برای نتیجه‌ی جدی‌تر ۳ تا ۵ ساعت توصیه می‌شود.
  goal_hours: 1.5

audio:
  # Whisper فقط صدای ۱۶ کیلوهرتز مونو می‌پذیرد؛ همه‌ی فایل‌ها به این فرمت تبدیل می‌شوند.
  sample_rate: 16000

download:
  # حداکثر طول هر ویدیو/فایل (دقیقه). ویدیوهای خیلی طولانی معمولاً موسیقی یا تکرار دارند.
  max_minutes: 40
  # حداقل طول هر ویدیو (ثانیه). ویدیوهای خیلی کوتاه (مثلاً شورتس) را رد می‌کند.
  min_seconds: 30
  # زیرنویس فارسی را هم دانلود کن؛ زیرنویس هم مرز جمله‌ها و هم متن اولیه را می‌دهد.
  subtitles: true
  # اگر زیرنویس انسانی نبود، از زیرنویس خودکار یوتیوب استفاده شود؟ (کیفیتش متوسط است و حتماً باید بازبینی شود)
  allow_auto_subtitles: true
  # کدهای زبان زیرنویس که جستجو می‌شوند.
  subtitle_langs: [fa, fa-IR, fas]

segmentation:
  # روش برش: auto = اگر زیرنویس بود از زیرنویس، وگرنه VAD | subtitles | vad
  method: auto
  # کلیپ‌های کوتاه‌تر از این (ثانیه) دور ریخته می‌شوند؛ معمولاً فقط نویز یا «اِ...» هستند.
  min_seconds: 2.0
  # سقف طول هر کلیپ (ثانیه). Whisper تا ۳۰ ثانیه را می‌پذیرد؛ ۲۰ حاشیه‌ی امن است.
  max_seconds: 20.0
  # طول هدف هر کلیپ (ثانیه). جمله‌های پشت‌سرهم تا رسیدن به این طول به هم چسبانده می‌شوند.
  target_seconds: 8.0
  # چند میلی‌ثانیه سکوت به ابتدا و انتهای هر کلیپ اضافه شود تا کلمه‌ها نصفه بریده نشوند.
  padding_ms: 150
  vad:
    # طول هر فریم تحلیل انرژی (میلی‌ثانیه).
    frame_ms: 30
    # آستانه‌ی گفتار = کف نویز + این مقدار (دسی‌بل). عدد بزرگ‌تر = حساسیت کمتر.
    threshold_db: 12
    # سکوت‌های کوتاه‌تر از این (میلی‌ثانیه) قطع گفتار حساب نمی‌شوند.
    min_silence_ms: 350
    # تکه‌های گفتار کوتاه‌تر از این (میلی‌ثانیه) نادیده گرفته می‌شوند.
    min_speech_ms: 250

labeling:
  # مدلی که برای متن اولیه (pseudo-label) کلیپ‌های بدون زیرنویس استفاده می‌شود.
  # بزرگ‌ترین مدلی که سخت‌افزارت اجازه می‌دهد؛ متنش بعداً در پنل اصلاح می‌شود.
  model: openai/whisper-large-v3
  # تعداد کلیپ‌هایی که هم‌زمان به مدل داده می‌شود. روی CPU یا GPU کم‌حافظه کمش کن.
  batch_size: 8

split:
  # چه کسری از داده برای تست (ارزیابی) کنار گذاشته شود.
  test_ratio: 0.2
  # تقسیم بر اساس منبع (ویدیو): کلیپ‌های یک ویدیو همه در train یا همه در test می‌روند
  # تا مدل صدای همان گوینده را در تست «حفظ» نکرده باشد و نتیجه صادقانه باشد.
  by_source: true
  # عدد ثابت برای تکرارپذیر بودن تقسیم‌بندی.
  seed: 42
  # کلیپ‌های بازبینی‌نشده (pending) که متن دارند هم در train استفاده شوند؟
  # test همیشه فقط از کلیپ‌های تأییدشده ساخته می‌شود.
  include_pending_in_train: false
