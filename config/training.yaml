# ─────────────────────────────────────────────────────────────
# تنظیمات فاین‌تیون Whisper
# این فایل از پنل هم ویرایش می‌شود؛ توضیح‌ها از persian_asr/config_schema.py می‌آیند.
# ─────────────────────────────────────────────────────────────

# ── مدل ──
# مدل پایه: کلید یکی از مدل‌های config/models.yaml. مدلی که وزن‌هایش با دیتاست لهجه به‌روز می‌شود.
model: whisper-small
# پوشه‌ی خروجی: چک‌پوینت‌ها، لاگ آموزش و مدل نهایی (در زیرپوشه‌ی final) اینجا ذخیره می‌شوند.
output_dir: outputs/whisper-small-isfahani
# فریز کردن انکودر: انکودر (بخش شنیداری) ثابت می‌ماند و فقط دیکودر یاد می‌گیرد. حافظه کمتر و خطر overfit کمتر، ولی تطبیق با تلفظ لهجه ضعیف‌تر.
freeze_encoder: false

# ── LoRA ──
# استفاده از LoRA: به‌جای همه‌ی وزن‌ها فقط ماتریس‌های کوچک کمکی آموزش می‌بینند. برای medium/large یا GPU کم‌حافظه روشنش کن.
use_lora: false
# رتبه‌ی LoRA (r): اندازه‌ی ماتریس‌های کمکی. بزرگ‌تر = ظرفیت یادگیری بیشتر و حافظه‌ی بیشتر. ۱۶ تا ۶۴ معمول است.
lora_r: 32
# ضریب LoRA (alpha): شدت اثر وزن‌های LoRA. معمولاً دو برابر r گذاشته می‌شود.
lora_alpha: 64
# Dropout در LoRA: درصد خاموش‌کردن تصادفی در لایه‌های LoRA برای جلوگیری از حفظ‌کردن داده‌ی کم.
lora_dropout: 0.05

# ── بهینه‌سازی ──
# نرخ یادگیری: اندازه‌ی گام به‌روزرسانی وزن‌ها. برای فاین‌تیون کامل ۱e-5 و برای LoRA حدود ۱e-3. زیاد باشد مدل فارسی‌اش را «فراموش» می‌کند.
learning_rate: 1.0e-05
# تعداد دوره (epoch): چند بار کل داده‌ی train دیده شود. با داده‌ی کم (۳۰۰-۸۰۰ کلیپ) ۳ تا ۸ دوره مناسب است.
num_train_epochs: 5
# حداکثر گام: اگر بزرگ‌تر از صفر باشد به‌جای epoch، آموزش بعد از این تعداد گام متوقف می‌شود. ‎-1 یعنی غیرفعال.
max_steps: -1
# اندازه‌ی batch آموزش: تعداد کلیپ در هر گام روی هر GPU. اگر خطای کمبود حافظه (OOM) گرفتی کمش کن.
per_device_train_batch_size: 8
# انباشت گرادیان: گرادیان چند گام جمع می‌شود و بعد وزن‌ها آپدیت می‌شوند؛ batch مؤثر = batch × این عدد. جایگزین batch بزرگ با حافظه‌ی کم.
gradient_accumulation_steps: 2
# گام‌های گرم‌کردن: نرخ یادگیری در این تعداد گام اول از صفر به مقدار اصلی می‌رسد تا شروع آموزش مدل را خراب نکند.
warmup_steps: 50
# Weight decay: جریمه‌ی کوچک برای وزن‌های بزرگ؛ کمی جلوی overfit روی دیتاست کوچک را می‌گیرد.
weight_decay: 0.01
# زمان‌بندی نرخ یادگیری: نحوه‌ی کاهش نرخ یادگیری در طول آموزش. linear ساده و مطمئن است؛ cosine نرم‌تر کم می‌کند.
lr_scheduler_type: linear

# ── داده ──
# SpecAugment: بخش‌هایی از طیف صدا را تصادفی می‌پوشاند تا مدل با داده‌ی کم بهتر تعمیم دهد. برای دیتاست کوچک روشن بماند.
apply_spec_augment: true
# احتمال ماسک زمانی: سهم فریم‌های زمانی که در SpecAugment پوشانده می‌شوند. ۰.۰۵ تا ۰.۱ معمول است.
mask_time_prob: 0.05
# حداکثر طول متن (توکن): متن‌های طولانی‌تر از این تعداد توکن از آموزش حذف می‌شوند. سقف Whisper ۴۴۸ است.
max_label_length: 225

# ── ارزیابی ──
# فاصله‌ی ارزیابی (گام): هر چند گام یک بار WER روی داده‌ی test محاسبه شود. کمترش کنی نمودار دقیق‌تر ولی آموزش کندتر می‌شود.
eval_steps: 100
# فاصله‌ی ذخیره (گام): هر چند گام چک‌پوینت ذخیره شود. باید مضربی از فاصله‌ی ارزیابی باشد تا بهترین مدل انتخاب شود.
save_steps: 100
# فاصله‌ی ثبت لاگ (گام): هر چند گام loss در لاگ نوشته شود (برای نمودار پنل).
logging_steps: 10
# اندازه‌ی batch ارزیابی: تعداد کلیپ در هر گام ارزیابی. تولید متن حافظه‌ی بیشتری می‌گیرد؛ در صورت OOM کمش کن.
per_device_eval_batch_size: 8
# حداکثر طول خروجی: حداکثر تعداد توکنی که مدل هنگام ارزیابی تولید می‌کند.
generation_max_length: 225
# صبر توقف زودهنگام: اگر WER این تعداد ارزیابی پشت‌سرهم بهتر نشد آموزش متوقف می‌شود. ۰ یعنی غیرفعال.
early_stopping_patience: 3
# تعداد چک‌پوینت نگه‌داشته‌شده: چک‌پوینت‌های قدیمی‌تر پاک می‌شوند تا دیسک پر نشود (بهترین مدل همیشه نگه داشته می‌شود).
save_total_limit: 2

# ── سخت‌افزار ──
# دقت نیمه (fp16): روی GPU انویدیا حافظه را نصف و سرعت را بیشتر می‌کند. روی CPU خودکار خاموش می‌شود.
fp16: true
# Gradient checkpointing: حافظه‌ی GPU را خیلی کمتر می‌کند به قیمت حدود ۲۰٪ کندی. برای small به بالا روشن بماند.
gradient_checkpointing: true
# تعداد worker بارگذاری داده: تعداد پردازه‌هایی که هم‌زمان صدا را آماده می‌کنند. روی ویندوز اگر خطا داد ۰ بگذار.
dataloader_num_workers: 2
# Seed تصادفی: عدد ثابت برای تکرارپذیر بودن نتایج بین اجراهای مختلف.
seed: 42
