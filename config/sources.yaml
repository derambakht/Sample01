# ─────────────────────────────────────────────────────────────
# منابع صوتی برای جمع‌آوری دیتاست لهجه‌ی اصفهانی
# هر بخش را می‌توانی کم و زیاد کنی؛ دستور `python -m persian_asr.cli download` همه را می‌خواند.
# ─────────────────────────────────────────────────────────────

# جستجوهای یوتیوب: yt-dlp برای هر عبارت، N ویدیوی اول را پیدا و دانلود می‌کند.
# نکته: نتایج جستجو همیشه اصفهانیِ واقعی نیستند (تقلید لهجه، موسیقی، تهرانی)؛
# در پنل بخش «بررسی نمونه‌ها» کلیپ‌های نامناسب را «رد» کن.
youtube_searches:
  - query: "لهجه اصفهانی"
    max_results: 15
  - query: "گفتگو با مردم اصفهان"
    max_results: 10
  - query: "مصاحبه خیابانی اصفهان"
    max_results: 10
  - query: "طنز اصفهانی"
    max_results: 10
  - query: "خاطره گویی با لهجه اصفهانی"
    max_results: 10
  - query: "شبکه اصفهان گفتگو"
    max_results: 10

# لینک مستقیم ویدیو یا پلی‌لیست (یوتیوب، آپارات و هر سایتی که yt-dlp پشتیبانی کند).
# اگر کانال یا پلی‌لیست مطمئنی از گوینده‌ی اصفهانی پیدا کردی، اینجا بگذار؛ کیفیت داده خیلی بهتر می‌شود.
urls: []
#  - https://www.youtube.com/watch?v=XXXXXXXXXXX
#  - https://www.aparat.com/v/XXXXX

# صفحه‌های برنامه در سایت ایران‌صدا (مثلاً برنامه‌های رادیو اصفهان).
# اسکریپت لینک‌های mp3/m4a داخل صفحه را پیدا و دانلود می‌کند؛ اگر نشد، از yt-dlp کمک می‌گیرد.
iranseda_pages: []
#  - https://radio.iranseda.ir/Program/?VALID=TRUE&ch=XX&m=XXXXXX

# پوشه‌های محلی شامل فایل صوتی (مثلاً صدای ضبط‌شده‌ی دوستان اصفهانی).
# اگر کنار هر فایل یک .txt هم‌نام باشد، متنش به‌عنوان رونوشت استفاده می‌شود.
local_dirs: []
#  - /path/to/my/recordings
